[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
default-members = ["crates/graft", "crates/graft-core"]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
graft-core = { path = "crates/graft-core" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
egui = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
