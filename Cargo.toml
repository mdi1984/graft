[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
default-members = ["crates/graft", "crates/graft-core"]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
graft-core = { path = "crates/graft-core" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "persistence", "wgpu_no_default_features"] }
# eframe draws with wgpu, here DirectX 12 only (see main.rs). Graft depends
# on wgpu directly to pick that backend and to configure it.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
egui = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
