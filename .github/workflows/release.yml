# Builds and publishes a release when a version tag (v1.2.3) is pushed.
# The tag must match the version in Cargo.toml; see "Releases" in CLAUDE.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'graft').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the version in Cargo.toml ($version)."
          }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p graft

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version $env:VERSION

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName `
            --title "Graft $env:VERSION" --generate-notes --verify-tag

  # Sends the new version to winget (a PR to microsoft/winget-pkgs) once the
  # release is out. Needs the secret WINGET_TOKEN: a classic token with the
  # public_repo scope, from an account with a fork of microsoft/winget-pkgs.
  # Without the secret this job does nothing.
  winget:
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.WINGET_TOKEN == ''
        run: echo "No WINGET_TOKEN secret, so winget is not updated."
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: mdi1984.Graft
          installers-regex: '-x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
