# Builds and publishes a release when a version tag (v1.2.3) is pushed.
# The tag must match the version in Cargo.toml; see "Releases" in CLAUDE.md.
# Run by hand (Actions > Release > Run workflow), it is a dry run: the same
# tests and packages, uploaded as an artifact instead of published.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Start from the release build CI saved on main (its package job).
      # A tag's own cache would never be used again, so none is saved.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package
          save-if: false

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'graft').version
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the version in Cargo.toml ($version)."
          }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      # Release mode reuses the cached release build; CI already ran the
      # tests in debug mode on this commit. Not --workspace: icon-gen has no
      # tests, and building it alongside changes the features of shared
      # crates (gix, wgpu, egui), so they would all compile again.
      - name: Tests
        run: cargo test --release --locked -p graft -p graft-core

      - name: Build
        run: cargo build --release --locked -p graft

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version $env:VERSION

      - name: Keep the dry run's packages
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: graft-release-dry-run
          path: dist/
          retention-days: 3

      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName `
            --title "Graft $env:VERSION" --generate-notes --verify-tag
